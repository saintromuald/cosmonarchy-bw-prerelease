##DATA
##
#controls all features that don't have their own labels
hydra_misc = true
#make bactalisk creepers unselectable and scarabs selectable
unit_selectable = Add(scarab)
#requires burrow status and creeper flag from 0x132 gptp, erases flag and removes unit
remove_creeper = false
#allows to use irradiate function to set creeper link from gptp
creeper_link = false
#cyprian and Shaman game commands for their state change abilities, sent from use_tech (gptp)
hydra_command_opcodes = true
#makes parasite last 1 minute
parasite_timers = false
#allows resetting of escalation upgrades
escalations_enabled = false
relics = false
#does not support Remove currently
#relic_setup = Add(200;201;202;203;204;205;206;207;208;209;210;211;212;213;214;215;216;217;218;219;220;221;222;223;224)
#relic_setup = Add(225;226;227;228;229;228;229;230;231;232;233;234;235;236;237;238;239;240)
#loads relic upgrades as values to reliquary
#reliquary_hero_loading = true
#decrements and erases legionnaire timer
legionnaire_timer = true
#decrements and erases hierophant timer
hierophant_timer = false
#applies movespeed and attackspeed slows while timer is active
hydra_signify_cowardice = false
hydra_signify_malice = false
#still requires scarabs to be modified in gptp
#relocator_reaver_pathfinding = true
#first is unit id, second is bullet id, third is bounce count
#bullet id is not used currently, it is a placeholder
#no remove supported
#bullet must have behavior Fly, bounce damage must be modified in gptp or other plugin or it will be bugged
bounce_set = Add(bactalisk,129,2)
#caustic fission is required for bactalisk's bounce attack if this option is enabled
hydra_caustic_fission = false
hydra_indomitable_musculature = false
#makes all reavers (including human-owned reavers) autobuild scarabs
reaver_autobuild = false
#for use with Maelstrom
hydra_malediction = false
